<p>
  <a href="{% url 'learning_logs:index' %}">Learning Log</a> -
  <a href="{% url 'learning_logs:topics' %}">Tematy</a> -
  {% if user.is_authenticated %}
    Witaj, {{ user.username }}.
    <form action="{% url 'users:logout' %}" method="post" style="display:inline;">
                {% csrf_token %}
                <button type="submit" style="background:none; border:none; color:blue; cursor:pointer; padding:0; font:inherit;">
                    Wyloguj
                </button>
            </form>
  {% else %}
    <a href="{% url 'users:register' %}">Zarejestruj</a> -
    <a href="{% url 'users:login' %}">Zaloguj</a>
  {% endif %}
</p>

{% block content %}{% endblock content %}
